<!doctype html>
<html lang="pt-PT">
<head>

<title>Nascente</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="cormorant.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="paisagem" aria-hidden="true">
  <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice">
    <defs>
      <radialGradient id="gLua" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f6efd8" stop-opacity=".9"/><stop offset=".22" stop-color="#e9dfbf" stop-opacity=".55"/><stop offset=".5" stop-color="#9fd3c4" stop-opacity=".08"/><stop offset="1" stop-color="#9fd3c4" stop-opacity="0"/></radialGradient>
      <linearGradient id="gM1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16332e"/><stop offset="1" stop-color="#0a1a17"/></linearGradient>
      <linearGradient id="gM2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10261f"/><stop offset="1" stop-color="#081412"/></linearGradient>
      <linearGradient id="gM3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1c18"/><stop offset="1" stop-color="#050d0c"/></linearGradient>
      <linearGradient id="gLago" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123631" stop-opacity=".9"/><stop offset="1" stop-color="#06110f"/></linearGradient>
      <linearGradient id="gCasc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfeee6" stop-opacity="0"/><stop offset=".3" stop-color="#cfeee6" stop-opacity=".55"/><stop offset="1" stop-color="#cfeee6" stop-opacity=".15"/></linearGradient>
    </defs>
    <circle cx="318" cy="118" r="90" fill="url(#gLua)" opacity=".7"/>
    <circle cx="318" cy="118" r="17" fill="#f3ead2" opacity=".6"/>
    <path d="M0 470 L40 430 L70 445 L110 380 L140 410 L175 350 L205 395 L240 360 L280 420 L320 370 L360 430 L400 400 V800 H0Z" fill="url(#gM1)" opacity=".75"/>
    <path d="M0 520 L35 490 L60 505 L95 450 L120 470 L150 430 L170 455 L195 440 L230 500 L265 470 L300 515 L340 470 L370 495 L400 470 V800 H0Z" fill="url(#gM2)"/>
    <path class="cascata" d="M196 444 C197 480 194 520 196 585" stroke="url(#gCasc)" stroke-width="3" fill="none"/>

  <div class="nevoa n1"></div><div class="nevoa n2"></div><div class="nevoa n3"></div>
</div>
<canvas id="qi" aria-hidden="true"></canvas>

<div id="app">
  <header class="topo">
    <svg class="selo" viewBox="0 0 48 48" aria-hidden="true">
      <defs><linearGradient id="gSelo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bff0dc"/><stop offset=".55" stop-color="#6fc6a6"/><stop offset="1" stop-color="#e0c27a"/></linearGradient></defs>
      <path d="M24 5c5 8 9 12.5 9 18a9 9 0 0 1-18 0c0-5.5 4-10 9-18z" fill="none" stroke="url(#gSelo)" stroke-width="2"/>
      <ellipse cx="24" cy="38" rx="15" ry="3.6" fill="none" stroke="url(#gSelo)" stroke-width="1.6" opacity=".8"/>
      <ellipse cx="24" cy="38" rx="21" ry="5.2" fill="none" stroke="url(#gSelo)" stroke-width="1.1" opacity=".45"/>
      <path d="M20 21c1.5-3 3-4.5 4-6" stroke="#e8fff6" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
    </svg>
    <h1 class="marca">NASCENTE</h1>
    <span class="cresce"></span>
    <span id="reinoTopo" class="reino-topo"></span>
    <span id="syncPonto" class="ponto" hidden></span>
  </header>
  <main>
    <section id="vRitual" class="vista"></section>
    <section id="vFrascos" class="vista" hidden></section>
    <section id="vPele" class="vista" hidden></section>
    <section id="vMeditar" class="vista" hidden></section>
    <section id="vMestre" class="vista" hidden></section>
    <section id="vPerfil" class="vista" hidden></section>
  </main>
</div>

<nav id="nav">
  <button data-vista="vRitual" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19c-3-2-4.5-5-4.5-8.5C9 12 10.5 13 12 14c1.5-1 3-2 4.5-3.5 0 3.5-1.5 6.5-4.5 8.5z"/><path d="M12 14c-1.2-2.5-1.2-5.5 0-9 1.2 3.5 1.2 6.5 0 9z"/><path d="M7.5 10.5C5 10 3.5 10.5 2.5 12c1.5 3 4.5 5.5 9.5 7M16.5 10.5c2.5-.5 4 0 5 1.5-1.5 3-4.5 5.5-9.5 7"/><path d="M5 21.5h14"/></svg>Ritual</button>
  <button data-vista="vFrascos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5h4v3h-4z"/><path d="M9 7.5h6l1.5 2.5v9.5a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2V10z"/><path d="M12 5.5v2M9.5 14h5"/></svg>Frascos</button>
  <button data-vista="vPele"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-4.5 0-7 3.5-7 8 0 5 3.3 9.5 7 10 3.7-.5 7-5 7-10 0-4.5-2.5-8-7-8z"/><path d="M9 10.5h.01M15 10.5h.01M9.5 15.5c1.5 1 3.5 1 5 0"/></svg>Pele</button>
  <button data-vista="vMeditar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="2.4"/><circle cx="12" cy="12" r="6" opacity=".7"/><circle cx="12" cy="12" r="9.6" opacity=".4"/></svg>Meditar</button>
  <button data-vista="vMestre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c0-6 3.5-10 8-10s8 4 8 10z"/><circle cx="12" cy="5" r="2.2"/><path d="M8 18c1-2.5 2.3-3.5 4-3.5s3 1 4 3.5M2.5 21h19"/></svg>Mestre</button>
  <button data-vista="vPerfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>Perfil</button>
</nav>

<div id="sessao" hidden></div>
<div id="folha" class="folha" hidden><div class="veu" data-acao="fecharFolha"></div><div class="caixa" id="folhaCaixa"></div></div>

<script src="ia-comum.js"></script>
